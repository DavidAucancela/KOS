[project]
name = "kos"
version = "0.1.0"
description = "KOS — Knowledge Operating System (raíz del workspace uv)"
requires-python = ">=3.12"
dependencies = [
    "kos-core",
    "kos-connectors",
    "kos-api",
    "kos-workers",
    "kos-mcp-tools",
    "kos-agents",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/connectors", "packages/mcp-tools", "packages/agents", "apps/api", "apps/workers"]

[tool.uv.sources]
kos-core = { workspace = true }
kos-connectors = { workspace = true }
kos-api = { workspace = true }
kos-workers = { workspace = true }
kos-mcp-tools = { workspace = true }
kos-agents = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "import-linter>=2.1",
    "mcp[cli]>=2.0.0,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["kos_core", "kos_api", "kos_workers", "kos_connectors", "kos_mcp", "kos_agents"]

[tool.ruff.lint.flake8-bugbear]
# Patrón idiomático de FastAPI: Depends/Query en defaults de parámetros
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "apps"]
markers = [
    "integration: requiere la infraestructura local (make up) y Ollama nativo",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["minio.*", "pgvector.*", "celery.*"]
ignore_missing_imports = true

# doc 09 §2: "packages/mcp-tools solo depende de core" — hasta Sprint 16 esta
# regla no tenía verificación real pese a que el doc decía "se rechaza en CI".
[tool.importlinter]
root_packages = ["kos_mcp", "kos_agents", "kos_api", "kos_workers"]

[[tool.importlinter.contracts]]
name = "kos_mcp no depende de apps/*"
type = "forbidden"
source_modules = ["kos_mcp"]
forbidden_modules = ["kos_api", "kos_workers"]

# doc 09 §2: "packages/agents solo depende de core" — ADR-0005 exige que los
# agentes consuman herramientas solo vía MCP, nunca importando kos_mcp
# directo (ver kos_agents/base.py::ToolCaller, duck typing sin import).
[[tool.importlinter.contracts]]
name = "kos_agents no depende de apps/* ni de kos_mcp"
type = "forbidden"
source_modules = ["kos_agents"]
forbidden_modules = ["kos_api", "kos_workers", "kos_mcp"]
