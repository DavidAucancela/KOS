[project]
name = "kos-core"
version = "0.1.0"
description = "Contratos, configuración y clientes compartidos de KOS (doc 10 §5)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.41",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "alembic>=1.16",
    "neo4j>=5.28",
    "redis>=6.2",
    "minio>=7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kos_core"]
