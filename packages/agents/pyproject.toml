[project]
name = "kos-agents"
version = "0.1.0"
description = "Agentes de KOS sobre AgentRequest/AgentResponse (doc 03, doc 10 §7)"
requires-python = ">=3.12"
dependencies = [
    "kos-core",
]

[tool.uv.sources]
kos-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kos_agents"]
