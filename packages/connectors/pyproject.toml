[project]
name = "kos-connectors"
version = "0.1.0"
description = "Conectores de fuentes de KOS: un subpaquete por fuente (doc 10 §6)"
requires-python = ">=3.12"
dependencies = [
    "kos-core",
    "pyyaml>=6.0",
]

[tool.uv.sources]
kos-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kos_connectors"]
