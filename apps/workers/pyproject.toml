[project]
name = "kos-workers"
version = "0.1.0"
description = "Workers asíncronos de KOS — Celery + Redis (doc 05)"
requires-python = ">=3.12"
dependencies = [
    "kos-core",
    "kos-connectors",
    "celery[redis]>=5.5",
]

[tool.uv.sources]
kos-core = { workspace = true }
kos-connectors = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kos_workers"]
